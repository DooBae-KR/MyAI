server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    schemas: personal_ai
    default-schema: personal_ai
    create-schemas: true
  jpa:
    open-in-view: false
    properties:
      hibernate.default_schema: personal_ai
    hibernate:
      ddl-auto: none   # 스키마는 Flyway(ai-data/db/migration)만 변경한다

ollama:
  base-url: http://localhost:11434
  model: qwen3:14b

ai:
  # ollama(로컬 LLM, 기본값) | claude(Claude API)
  provider: ${AI_PROVIDER:ollama}

claude:
  api-key: ${ANTHROPIC_API_KEY:}
  model: ${CLAUDE_MODEL:claude-sonnet-5-5}

mcp:
  # 비어 있으면 인증 없음. 외부에 노출하면 반드시 설정 (Authorization: Bearer <값>)
  token: ${MCP_TOKEN:}
