server:
  port: 8080
  # 기본은 내 PC에서만 접속 가능. /api에는 인증이 없으니 다른 PC에서 접속해야 할 때만 SERVER_ADDRESS=0.0.0.0 으로 바꿀 것
  address: ${SERVER_ADDRESS:127.0.0.1}
  error:
    include-message: never   # 예상 못 한 예외의 상세 메시지는 숨긴다. 예상한 오류는 ApiExceptionHandler가 message를 준다
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  config:
    # .env를 IDE/터미널 구분 없이 읽는다. 실행 위치가 루트일 때와 ai-api일 때를 모두 지원.
    # OS 환경변수가 있으면 그쪽이 우선한다. 값에 따옴표를 쓰지 말 것 (KEY=값)
    import: optional:file:./.env[.properties],optional:file:../.env[.properties]
  datasource:
    # DB_URL(전체 JDBC 주소)이 있으면 그것을, 없으면 DB_HOST/DB_PORT/DB_NAME으로 조립한다
    url: ${DB_URL:jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:postgres}}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    # 스키마 변경 권한이 있는 계정. 비우면 앱 계정(DB_USERNAME)을 그대로 쓴다. 앱 계정을 최소 권한으로 낮출 때만 설정 (README 참고)
    user: ${DB_MIGRATION_USERNAME:${DB_USERNAME}}
    password: ${DB_MIGRATION_PASSWORD:${DB_PASSWORD}}
    schemas: personal_ai
    default-schema: personal_ai
    create-schemas: true
  jpa:
    open-in-view: false
    properties:
      hibernate.default_schema: personal_ai
    hibernate:
      ddl-auto: none   # 스키마는 Flyway(ai-data/db/migration)만 변경한다

ollama:
  base-url: http://localhost:11434
  model: qwen3:14b

ai:
  # auto(기본: 쓸 수 있는 Claude 우선, 없으면 ollama) | ollama | claude | claude-code
  provider: ${AI_PROVIDER:auto}

claude:
  api-key: ${ANTHROPIC_API_KEY:}
  model: ${CLAUDE_MODEL:claude-sonnet-5-5}

app:
  # 비어 있으면 /api 인증 없음. 서버를 외부(폰 앱)에 공개하면 반드시 설정 (Authorization: Bearer <값>)
  token: ${APP_TOKEN:}

discord:
  # Incoming Webhook 주소(비밀). 비어 있으면 알림 끔
  webhook-url: ${DISCORD_WEBHOOK_URL:}
  cron: ${DISCORD_CRON:0 0 21 * * *}   # 매일 21:00
  zone: ${DISCORD_ZONE:Asia/Seoul}

mcp:
  # 비어 있으면 인증 없음. 외부에 노출하면 반드시 설정 (Authorization: Bearer <값>)
  token: ${MCP_TOKEN:}
