server:
  port: 8080
  error:
    include-message: always   # 400/404/502 등의 사유를 응답 본문에 포함
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  config:
    # .env를 IDE/터미널 구분 없이 읽는다. 실행 위치가 루트일 때와 ai-api일 때를 모두 지원.
    # OS 환경변수가 있으면 그쪽이 우선한다. 값에 따옴표를 쓰지 말 것 (KEY=값)
    import: optional:file:./.env[.properties],optional:file:../.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    schemas: personal_ai
    default-schema: personal_ai
    create-schemas: true
  jpa:
    open-in-view: false
    properties:
      hibernate.default_schema: personal_ai
    hibernate:
      ddl-auto: none   # 스키마는 Flyway(ai-data/db/migration)만 변경한다

ollama:
  base-url: http://localhost:11434
  model: qwen3:14b

ai:
  # ollama(로컬 LLM, 기본값) | claude(Claude API)
  provider: ${AI_PROVIDER:ollama}

claude:
  api-key: ${ANTHROPIC_API_KEY:}
  model: ${CLAUDE_MODEL:claude-sonnet-5-5}

mcp:
  # 비어 있으면 인증 없음. 외부에 노출하면 반드시 설정 (Authorization: Bearer <값>)
  token: ${MCP_TOKEN:}

stock:
  # true면 cron 시각마다 watchlist를 분석해 디스코드로 보낸다 (수동 실행: POST /api/stocks/recommend)
  enabled: ${STOCK_ENABLED:false}
  cron: ${STOCK_CRON:0 0 9 * * MON-FRI}   # Asia/Seoul 기준
  discord-webhook-url: ${DISCORD_WEBHOOK_URL:}
  watchlist: ${STOCK_WATCHLIST:}          # 야후 심볼을 쉼표로: 453810.KS,SPY
