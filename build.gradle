plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.5' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
}

allprojects {
    group = 'com.personal.ai'
    version = '0.1.0'
    repositories { mavenCentral() }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'io.spring.dependency-management'

    java {
        toolchain { languageVersion = JavaLanguageVersion.of(21) }
    }

    dependencyManagement {
        imports { mavenBom 'org.springframework.boot:spring-boot-dependencies:3.5.5' }
    }

    dependencies {
        testImplementation 'org.springframework.boot:spring-boot-starter-test:3.5.5'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher' // Gradle 9는 런처를 직접 요구한다
    }

    tasks.named('test') { useJUnitPlatform() }
}
